spring.application.name=nutricare-pro-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutricare_pro?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.seed.admin-email=${APP_ADMIN_EMAIL:admin@nutricarepro.com}
app.seed.admin-password=${APP_ADMIN_PASSWORD:admin123}
app.seed.admin-name=${APP_ADMIN_NAME:Nutriologo Administrador}
