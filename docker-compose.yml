services:
  mysql:
    image: mysql:8.4
    container_name: nutricare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nutricare_pro}
      MYSQL_USER: ${MYSQL_USER:-nutricare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nutricare_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-java
    container_name: nutricare-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-nutricare_pro}?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-nutricare}
      DB_PASSWORD: ${MYSQL_PASSWORD:-nutricare_password}
      JPA_DDL_AUTO: update
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@nutricarepro.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Nutriologo Administrador}
      CORS_ALLOWED_ORIGINS: "*"

volumes:
  mysql_data:
